name: Build Heart & Soul co-op ROM

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - 'graphics/**'
      - 'sound/**'
      - 'Makefile'
      - 'make/**'
      - 'ld_script*.ld'
      - '.github/workflows/build-coop-rom.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Heart & Soul source
        uses: actions/checkout@v4

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Compile Heart & Soul ROM
        run: make hns -j2
