name: Build Heart & Soul Co-op ROM

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - 'asm/**'
      - 'constants/**'
      - 'graphics/**'
      - 'Makefile'
      - 'make/**'
      - 'ld_script*.ld'
      - 'config.mk'
      - '.github/workflows/build-hns-coop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Heart & Soul source
        uses: actions/checkout@v4

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3

      - name: Build Heart & Soul ROM
        run: make hns -j$(nproc) -O

      - name: Publish Heart & Soul co-op ROM directly to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="hns-coop-${{ github.run_number }}"
          gh release create "$tag" pokehns.gba \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Heart & Soul Co-op ROM Build ${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }}. This is the patched Heart & Soul GBA ROM for the two-player co-op test. Use with the matching Android co-op APK and Windows server." \
            --latest=false
